<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --surface: #ffffff;
            --border: #e3e8f0;
            --text: #172033;
            --muted: #6b7592;
            --accent: #4f6ef7;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-header {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px 24px 12px;
        }

        .app-header h1 {
            margin: 0 0 6px;
            font-size: 1.7rem;
        }

        .app-header p {
            margin: 0;
            color: var(--muted);
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px 24px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .board-column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            min-height: 280px;
            box-shadow: var(--shadow);
        }

        .board-column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .board-column h2 {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .board-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            border-radius: 999px;
            background: #eef3ff;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
            cursor: grab;
        }

        .task-card.dragging {
            opacity: 0.6;
        }

        .board-column.drag-over {
            border-color: var(--accent);
            background: #f4f7ff;
        }

        .task-card h3 {
            margin: 0 0 6px;
            font-size: 1rem;
        }

        .task-card p {
            margin: 0 0 10px;
            color: var(--muted);
            line-height: 1.45;
        }

        .task-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .edit-button {
            border: 1px solid var(--border);
            background: #f8fafc;
            color: var(--text);
            border-radius: 999px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .retry-button,
        .new-task-button,
        .modal-submit-button,
        .modal-cancel-button {
            border: none;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .new-task-button,
        .modal-submit-button {
            background: var(--accent);
            color: #ffffff;
        }

        .modal-cancel-button {
            background: #f8fafc;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .priority-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: #eef3ff;
            color: var(--accent);
        }

        .priority-pill.high {
            background: #ffe7e7;
            color: #b23a3a;
        }

        .priority-pill.medium {
            background: #fff4df;
            color: #a86a00;
        }

        .priority-pill.low {
            background: #eaf7ed;
            color: #2a7a41;
        }

        .loading-skeleton {
            height: 72px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: linear-gradient(90deg, #f1f4f8 25%, #e7edf5 37%, #f1f4f8 63%);
            background-size: 400% 100%;
            animation: shimmer 1.2s ease-in-out infinite;
        }

        .empty-column {
            border: 1px dashed #c8d1e0;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: #73809b;
            background: #f8fafc;
            font-size: 0.95rem;
        }

        .error-card {
            border: 1px solid #f0c7c7;
            border-radius: 12px;
            background: #fff4f4;
            color: #a73d3d;
            padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(167, 61, 61, 0.08);
        }

        .board-message {
            grid-column: 1 / -1;
            margin-bottom: 10px;
            border: 1px solid #f0c7c7;
            border-radius: 12px;
            background: #fff4f4;
            color: #a73d3d;
            padding: 10px 12px;
        }

        .app-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            width: min(100%, 560px);
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close-button {
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-form {
            display: grid;
            gap: 12px;
        }

        .form-row {
            display: grid;
            gap: 8px;
        }

        .form-row label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-row input,
        .form-row textarea,
        .form-row select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font: inherit;
            color: var(--text);
        }

        .form-row textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-error {
            color: #a73d3d;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
        }

        @keyframes shimmer {
            100% {
                background-position: -100% 0;
            }
        }

        @media (max-width: 700px) {
            #board {
                grid-template-columns: 1fr;
            }

            .app-header {
                padding: 20px 16px 10px;
            }

            main {
                padding: 0 16px 16px;
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="app-header-content">
            <div>
                <h1>Task Board</h1>
                <p>Drag tasks between columns to update their status</p>
            </div>
            <button type="button" class="new-task-button" id="new-task-button">New Task</button>
        </div>
    </header>

    <main>
        <section id="board" class="board" aria-live="polite"></section>
    </main>

    <div class="modal-overlay" id="task-modal-overlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <div class="modal-header">
                <h2 id="task-modal-title">New Task</h2>
                <button type="button" class="modal-close-button" id="task-modal-close" aria-label="Close">×</button>
            </div>
            <form class="modal-form" id="task-form">
                <input type="hidden" id="task-id" name="taskId">
                <div class="form-row">
                    <label for="task-title">Title</label>
                    <input id="task-title" name="title" type="text">
                    <div class="form-error" id="title-error"></div>
                </div>
                <div class="form-row">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" name="description"></textarea>
                </div>
                <div class="form-row">
                    <label for="task-status">Status</label>
                    <select id="task-status" name="status">
                        <option value="ToDo">ToDo</option>
                        <option value="InProgress">InProgress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority" name="priority">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="task-assignee">Assignee</label>
                    <input id="task-assignee" name="assignee" type="text">
                </div>
                <div class="form-error" id="form-error"></div>
                <div class="modal-actions">
                    <button type="button" class="modal-cancel-button" id="task-modal-cancel">Cancel</button>
                    <button type="submit" class="modal-submit-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const Statuses = ['ToDo', 'InProgress', 'Done'];
        const Status_Labels = {
            'ToDo': 'ToDo',
            'InProgress': 'In Progress',
            'Done': 'Done'
        };
        const PRIORITIES = { High: 0, Medium: 1, Low: 2 };

        let tasks = [];
        let boardState = 'loading';
        let noticeMessage = '';
        let draggedTaskId = null;
        let modalMode = 'create';
        let activeTaskId = null;

        function getPriorityRank(priority) {
            const value = String(priority || '').toLowerCase();
            if (value === 'high') return PRIORITIES.High;
            if (value === 'medium') return PRIORITIES.Medium;
            if (value === 'low') return PRIORITIES.Low;
            return 99;
        }

        function compareTasks(a, b) {
            const priorityDifference = getPriorityRank(a.priority) - getPriorityRank(b.priority);
            if (priorityDifference !== 0) {
                return priorityDifference;
            }

            const leftId = Number(a.id);
            const rightId = Number(b.id);
            if (!Number.isNaN(leftId) && !Number.isNaN(rightId)) {
                return leftId - rightId;
            }

            return String(a.id).localeCompare(String(b.id));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getErrorMessage(payload, response) {
            if (payload && typeof payload === 'object') {
                if (typeof payload.detail === 'string') {
                    return payload.detail;
                }
                if (Array.isArray(payload.detail)) {
                    return payload.detail.map((item) => item.msg || item.detail || JSON.stringify(item)).join(', ');
                }
            }

            if (response && response.status) {
                return `Server returned ${response.status}.`;
            }

            return 'Unable to update task status.';
        }

        function isValidTransition(currentStatus, targetStatus) {
            const validTransitions = {
                ToDo: ['InProgress'],
                InProgress: ['Done'],
                Done: ['InProgress']
            };

            return (validTransitions[currentStatus] || []).includes(targetStatus);
        }

        function buildTaskCard(task) {
            const priority = task.priority || 'Medium';
            const priorityClass = String(priority).toLowerCase();

            return `
                <article class="task-card" draggable="true" data-task-id="${escapeHtml(task.id)}">
                    <h3>${escapeHtml(task.title || 'Untitled task')}</h3>
                    <p>${escapeHtml(task.description || 'No description')}</p>
                    <div class="task-card-footer">
                        <span class="priority-pill ${priorityClass}">${escapeHtml(priority)}</span>
                        <button type="button" class="edit-button" data-task-id="${escapeHtml(task.id)}">Edit</button>
                    </div>
                </article>
            `;
        }

        function buildColumn(status, columnTasks) {
            const title = Status_Labels[status] || status;
            const content = columnTasks.length
                ? columnTasks.map(buildTaskCard).join('')
                : '<div class="empty-column">Drop tasks here</div>';

            return `
                <section class="board-column" data-status="${escapeHtml(status)}" aria-label="${escapeHtml(title)}">
                    <div class="board-column-header">
                        <h2>${escapeHtml(title)}</h2>
                        <span class="board-count">${columnTasks.length}</span>
                    </div>
                    ${content}
                </section>
            `;
        }

        function attachBoardEvents() {
            const board = document.getElementById('board');
            if (!board) return;

            board.querySelectorAll('.task-card').forEach((card) => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
            });

            board.querySelectorAll('.edit-button').forEach((button) => {
                button.addEventListener('click', (event) => {
                    const taskId = event.currentTarget.getAttribute('data-task-id');
                    const task = tasks.find((item) => String(item.id) === String(taskId));
                    if (task) {
                        openTaskModal('edit', task);
                    }
                });
            });

            board.querySelectorAll('.board-column').forEach((column) => {
                column.addEventListener('dragover', handleDragOver);
                column.addEventListener('dragleave', handleDragLeave);
                column.addEventListener('drop', handleDrop);
            });
        }

        function renderBoard() {
            const board = document.getElementById('board');
            if (!board) return;

            const groupedTasks = Statuses.reduce((result, status) => {
                result[status] = [];
                return result;
            }, {});

            tasks.forEach((task) => {
                const status = task.status;
                if (groupedTasks[status]) {
                    groupedTasks[status].push(task);
                }
            });

            const columns = Statuses.map((status) => {
                const sortedTasks = [...groupedTasks[status]].sort(compareTasks);
                return buildColumn(status, sortedTasks);
            });

            const noticeMarkup = noticeMessage ? `<div class="board-message">${escapeHtml(noticeMessage)}</div>` : '';
            board.innerHTML = `${noticeMarkup}${columns.join('')}`;
            attachBoardEvents();
        }

        function render() {
            const board = document.getElementById('board');
            if (!board) return;

            if (boardState === 'loading') {
                board.innerHTML = `
                    <section class="board-column" aria-label="Loading">
                        <h2>To Do</h2>
                        <div class="loading-skeleton"></div>
                        <div class="loading-skeleton"></div>
                    </section>
                    <section class="board-column" aria-label="Loading">
                        <h2>In Progress</h2>
                        <div class="loading-skeleton"></div>
                    </section>
                    <section class="board-column" aria-label="Loading">
                        <h2>Done</h2>
                        <div class="loading-skeleton"></div>
                    </section>
                `;
                return;
            }

            if (boardState === 'error') {
                board.innerHTML = `
                    <div class="error-card">
                        <strong>Unable to load tasks.</strong><br>
                        Please check the API server and try again.
                        <div>
                            <button type="button" class="retry-button" onclick="fetchTasks()">Retry</button>
                        </div>
                    </div>
                `;
                return;
            }

            renderBoard();
        }

        function handleDragStart(event) {
            const taskId = event.currentTarget.getAttribute('data-task-id');
            draggedTaskId = taskId;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', taskId);
            event.currentTarget.classList.add('dragging');
        }

        function handleDragEnd(event) {
            event.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.board-column').forEach((column) => column.classList.remove('drag-over'));
            draggedTaskId = null;
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(event) {
            if (event.currentTarget.contains(event.relatedTarget)) {
                return;
            }
            event.currentTarget.classList.remove('drag-over');
        }

        async function handleDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            if (!draggedTaskId) {
                return;
            }

            const targetStatus = event.currentTarget.getAttribute('data-status');
            const currentTask = tasks.find((task) => String(task.id) === String(draggedTaskId));
            if (!currentTask || currentTask.status === targetStatus) {
                draggedTaskId = null;
                return;
            }

            if (!isValidTransition(currentTask.status, targetStatus)) {
                noticeMessage = 'Invalid status transition.';
                boardState = tasks.length ? 'ready' : 'empty';
                renderBoard();
                draggedTaskId = null;
                return;
            }

            const previousStatus = currentTask.status;
            noticeMessage = '';
            tasks = tasks.map((task) => {
                if (String(task.id) === String(draggedTaskId)) {
                    return { ...task, status: targetStatus };
                }
                return task;
            });
            boardState = tasks.length ? 'ready' : 'empty';
            renderBoard();

            try {
                const response = await fetch(`${API_URL}/tasks/${draggedTaskId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: targetStatus })
                });

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    const message = getErrorMessage(errorPayload, response);
                    tasks = tasks.map((task) => {
                        if (String(task.id) === String(draggedTaskId)) {
                            return { ...task, status: previousStatus };
                        }
                        return task;
                    });
                    noticeMessage = `${message}`;
                    boardState = tasks.length ? 'ready' : 'empty';
                    renderBoard();
                    return;
                }
            } catch (error) {
                tasks = tasks.map((task) => {
                    if (String(task.id) === String(draggedTaskId)) {
                        return { ...task, status: previousStatus };
                    }
                    return task;
                });
                noticeMessage = 'Unable to move task. Please check your connection and try again.';
                boardState = tasks.length ? 'ready' : 'empty';
                renderBoard();
                return;
            }

            draggedTaskId = null;
        }

        function openTaskModal(mode, task) {
            modalMode = mode;
            activeTaskId = task ? task.id : null;
            const overlay = document.getElementById('task-modal-overlay');
            const titleElement = document.getElementById('task-modal-title');
            const form = document.getElementById('task-form');
            const taskIdInput = document.getElementById('task-id');
            const titleInput = document.getElementById('task-title');
            const descriptionInput = document.getElementById('task-description');
            const statusInput = document.getElementById('task-status');
            const priorityInput = document.getElementById('task-priority');
            const assigneeInput = document.getElementById('task-assignee');
            const formError = document.getElementById('form-error');
            const titleError = document.getElementById('title-error');

            form.reset();
            formError.textContent = '';
            titleError.textContent = '';

            if (mode === 'edit' && task) {
                titleElement.textContent = 'Edit Task';
                taskIdInput.value = task.id || '';
                titleInput.value = task.title || '';
                descriptionInput.value = task.description || '';
                statusInput.value = task.status || 'ToDo';
                priorityInput.value = task.priority || 'Medium';
                assigneeInput.value = task.assignee || '';
            } else {
                titleElement.textContent = 'New Task';
                taskIdInput.value = '';
                statusInput.value = 'ToDo';
                priorityInput.value = 'Medium';
            }

            overlay.classList.add('open');
            overlay.setAttribute('aria-hidden', 'false');
            titleInput.focus();
        }

        function closeTaskModal() {
            const overlay = document.getElementById('task-modal-overlay');
            const form = document.getElementById('task-form');
            const formError = document.getElementById('form-error');
            const titleError = document.getElementById('title-error');

            form.reset();
            formError.textContent = '';
            titleError.textContent = '';
            overlay.classList.remove('open');
            overlay.setAttribute('aria-hidden', 'true');
            modalMode = 'create';
            activeTaskId = null;
        }

        function getTaskFormPayload(formData) {
            const title = formData.get('title') || '';
            const description = formData.get('description') || '';
            const status = formData.get('status') || 'ToDo';
            const priority = formData.get('priority') || 'Medium';
            const assigneeValue = formData.get('assignee') || '';
            const assignee = assigneeValue.trim() ? assigneeValue.trim() : null;

            return {
                title: title.trim(),
                description: description.trim(),
                status,
                priority,
                assignee,
            };
        }

        function showFormError(message) {
            const titleError = document.getElementById('title-error');
            const formError = document.getElementById('form-error');
            titleError.textContent = '';
            formError.textContent = message;
        }

        async function submitTaskForm(event) {
            event.preventDefault();
            const form = document.getElementById('task-form');
            const formData = new FormData(form);
            const title = String(formData.get('title') || '').trim();
            const titleError = document.getElementById('title-error');
            const formError = document.getElementById('form-error');

            titleError.textContent = '';
            formError.textContent = '';

            if (!title) {
                titleError.textContent = 'Title is required';
                return;
            }

            const payload = getTaskFormPayload(formData);
            const url = modalMode === 'edit' && activeTaskId
                ? `${API_URL}/tasks/${activeTaskId}`
                : `${API_URL}/tasks`;
            const method = modalMode === 'edit' && activeTaskId ? 'PATCH' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    const message = getErrorMessage(errorPayload, response);
                    showFormError(message);
                    return;
                }

                closeTaskModal();
                await fetchTasks();
            } catch (error) {
                showFormError('Unable to save task. Please check your connection and try again.');
            }
        }

        async function fetchTasks() {
            noticeMessage = '';
            boardState = 'loading';
            render();

            try {
                const response = await fetch(`${API_URL}/tasks`);
                if (!response.ok) {
                    throw new Error('Request failed');
                }

                const data = await response.json();
                tasks = Array.isArray(data) ? data : [];
                boardState = tasks.length ? 'ready' : 'empty';
            } catch (error) {
                console.error(error);
                tasks = [];
                boardState = 'error';
            } finally {
                render();
            }
        }

        document.getElementById('new-task-button').addEventListener('click', () => openTaskModal('create'));
        document.getElementById('task-modal-close').addEventListener('click', closeTaskModal);
        document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
        document.getElementById('task-modal-overlay').addEventListener('click', (event) => {
            if (event.target.id === 'task-modal-overlay') {
                closeTaskModal();
            }
        });
        document.getElementById('task-form').addEventListener('submit', submitTaskForm);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeTaskModal();
            }
        });

        fetchTasks();
    </script>
</body>
